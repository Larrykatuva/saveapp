name: Deploy SaveApp (sandbox)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-sandbox
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Ubuntu VM via SSH (with password)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          command_timeout: 20m
          script: |
            set -e
            # Node and pm2 from nvm (the login user's, or root's)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] || export NVM_DIR="/root/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd /var/www/saveapp
            git stash
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            npm install
            npm run build
            pm2 restart saveapp --update-env
            pm2 logs saveapp --lines 50 --nostream
